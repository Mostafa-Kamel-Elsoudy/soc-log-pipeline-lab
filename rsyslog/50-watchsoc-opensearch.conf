# Install to /etc/rsyslog.d/50-watchsoc-opensearch.conf
# Requires the rsyslog-elasticsearch package (provides omelasticsearch).
# Validate with: rsyslogd -N1

module(load="imfile" PollingInterval="2")
module(load="omelasticsearch")

global(workDirectory="/var/spool/rsyslog")

# Tenant label is hard-coded in the template below. Change it per deployment.

template(name="watchsoc-json" type="list" option.jsonf="on") {
    property(outname="@timestamp" name="timereported" dateFormat="rfc3339" format="jsonf")
    property(outname="host" name="hostname" format="jsonf")
    constant(outname="tenant" value="lab-tenant" format="jsonf")
    property(outname="program" name="programname" format="jsonf")
    property(outname="tag" name="syslogtag" format="jsonf")
    property(outname="severity" name="syslogseverity-text" format="jsonf")
    property(outname="facility" name="syslogfacility-text" format="jsonf")
    property(outname="source_file" name="$!metadata!filename" format="jsonf")
    property(outname="message" name="msg" format="jsonf")
}

input(type="imfile"
      File="/var/log/auth.log"
      Tag="auth:"
      Severity="info"
      Facility="auth"
      addMetadata="on"
      ruleset="watchsoc")

# Suricata eve.json alerts. A simulated file is fine for the lab:
#   sudo mkdir -p /var/log/suricata && echo '{"event_type":"alert"}' | sudo tee -a /var/log/suricata/eve.json
input(type="imfile"
      File="/var/log/suricata/eve.json"
      Tag="suricata-eve:"
      Severity="warning"
      Facility="local5"
      addMetadata="on"
      ruleset="watchsoc")

# Events written by the ingest API (see ingest-api/server.js).
input(type="imfile"
      File="/var/log/watchsoc-ingest.log"
      Tag="watchsoc-ingest:"
      Severity="info"
      Facility="local4"
      addMetadata="on"
      ruleset="watchsoc")

ruleset(name="watchsoc") {
    # Local JSON copy is always written, so events survive an OpenSearch outage
    # even if the disk queue below is lost.
    action(type="omfile"
           file="/var/log/soc-structured.json"
           template="watchsoc-json"
           fileCreateMode="0640"
           dirCreateMode="0755"
           action.resumeRetryCount="3")

    # Disk-assisted LinkedList queue: messages are held in memory and spill to
    # /var/spool/rsyslog when the queue passes the high watermark or OpenSearch
    # is unreachable. Retries are unlimited.
    action(type="omelasticsearch"
           server="127.0.0.1"
           serverport="9200"
           template="watchsoc-json"
           searchIndex="soc-events"
           dynSearchIndex="off"
           bulkmode="on"
           errorFile="/var/log/rsyslog-es-errors.json"
           action.resumeRetryCount="-1"
           action.resumeInterval="10"
           queue.type="LinkedList"
           queue.filename="watchsoc_es"
           queue.maxdiskspace="1g"
           queue.size="50000"
           queue.highwatermark="40000"
           queue.lowwatermark="10000"
           queue.dequeuebatchsize="500"
           queue.saveonshutdown="on"
           queue.workerthreads="1")
}
