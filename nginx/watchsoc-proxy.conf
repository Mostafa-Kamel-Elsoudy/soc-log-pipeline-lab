# Install to /etc/nginx/conf.d/watchsoc-proxy.conf (http context).
# Certificates: scripts/generate-dev-certs.sh writes /etc/nginx/certs/watchsoc.{crt,key}.
# Validate with: nginx -t

limit_req_zone $binary_remote_addr zone=watchsoc_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=watchsoc_ui:10m rate=30r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/watchsoc.crt;
    ssl_certificate_key /etc/nginx/certs/watchsoc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:WATCHSOC_SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 128k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Ingest API. The /api prefix is stripped: /api/healthz -> /healthz,
    # /api/v1/tenant/<id>/events -> /v1/tenant/<id>/events.
    location /api/ {
        limit_req zone=watchsoc_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = / {
        return 302 /dashboards/;
    }

    # OpenSearch Dashboards, served under /dashboards (see docker-compose.yml).
    location / {
        limit_req zone=watchsoc_ui burst=60 nodelay;
        proxy_pass http://127.0.0.1:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
    }
}
